    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="canonical" href="__SITE_URL__/" data-site-url />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" data-site-url />
    <meta property="og:site_name" content="FameVote" />
    <meta property="og:title" content="FameVote: vote for your favourite stars" />
    <meta property="og:description" content="One vote per category, live rankings, and a receipt for every vote." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fv-theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var r = document.documentElement; r.dataset.theme = t; r.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'light' ? '#F8F7EE' : '#0f0f0c');
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
    <title>FameVote: vote for your favourite stars</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
