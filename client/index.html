    <script>
      (function () {
        try {
          var t = localStorage.getItem('fv-theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var r = document.documentElement; r.dataset.theme = t; r.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'light' ? '#F8F7EE' : '#0f0f0c');
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
